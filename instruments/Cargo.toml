[package]
name = "instruments"
version = "0.1.0"
edition = "2021"

[features]
rpc = ["dep:http", "dep:percent-encoding", "dep:tower-http"]

[dependencies]
chrono = { workspace = true }
colored = { workspace = true }
http = { optional = true, workspace = true }
opentelemetry = { features = ["logs", "metrics", "trace"], workspace = true }
opentelemetry_sdk = { features = [
    "logs",
    "metrics",
    "rt-tokio",
    "trace",
], workspace = true }
opentelemetry-appender-tracing = { workspace = true }
opentelemetry-otlp = { features = [
    "grpc-tonic",
    "logs",
    "metrics",
    "trace",
], workspace = true }
opentelemetry-semantic-conventions = { features = [
    "semconv_experimental",
], workspace = true }
opentelemetry-stdout = { features = [
    "logs",
    "metrics",
    "trace",
], workspace = true }
paste = { workspace = true }
percent-encoding = { optional = true, workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tower-http = { features = ["trace"], optional = true, workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { features = ["env-filter"], workspace = true }

# Internal dependencies
config = { workspace = true }
errors = { workspace = true }

[lints]
workspace = true
