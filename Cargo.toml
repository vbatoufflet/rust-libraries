[workspace]
members = ["config", "config-derive", "errors", "id", "instruments"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
chrono = "0.4"
colored = "3.0"
config-driver = { package = "config", version = "0.15" }
darling = "0.23"
http = "1.1"
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"
opentelemetry-appender-tracing = "0.31"
opentelemetry-otlp = "0.31"
opentelemetry-semantic-conventions = "0.31"
opentelemetry-stdout = "0.31"
paste = "1.0"
percent-encoding = "2.3"
proc-macro2 = "1.0"
quote = "1.0"
serde = "1.0"
sqlx = "0.8"
syn = "2.0"
thiserror = "2.0"
tokio = { features = ["macros", "rt-multi-thread"], version = "1.37" }
tower-http = "0.6"
tracing = "0.1.28"
tracing-opentelemetry = "0.32"
tracing-subscriber = "0.3"
uuid = { version = "1.11" }

# Internal dependencies
config = { path = "config" }
config-derive = { path = "config-derive" }
errors = { path = "errors" }
id = { path = "id" }
instruments = { path = "instruments" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
